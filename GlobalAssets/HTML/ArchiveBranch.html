<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="T.Goods discontinued branch archive" />
	<link rel="icon" data-site-favicon href="">
	<link rel="stylesheet" href="/GlobalAssets/CSS/HeaderFooter.css" />
	<link rel="stylesheet" href="/GlobalAssets/CSS/Archive.css" />
	<title>T.Goods Archive</title>
</head>
<body data-page="archive-branch">

	<div id="shared-header"></div>

	<div class="container" style="padding-top:22px">
		<div class="archive-breadcrumb" data-archive-breadcrumb></div>

		<div class="grid">
			<div class="card archive-branch-hero" data-archive-branch-hero>
				<div class="archive-branch-logo-wrap" data-archive-logo-wrap>
					<img class="archive-branch-logo" data-archive-logo alt="">
				</div>

				<div class="archive-branch-copy">
					<div class="archive-label">Discontinued T.Goods Branch</div>
					<h1 data-archive-title></h1>
					<p class="archive-dates" data-archive-dates></p>
					<div data-archive-bio></div>
				</div>
			</div>
		</div>

		<div class="grid" style="margin-top:14px">
			<div class="card">
				<h2>Projects</h2>
				<div class="archive-project-grid" data-archive-projects></div>
			</div>
		</div>
	</div>

	<div id="shared-footer"></div>

	<script type="module" src="/GlobalAssets/JS/ArchiveBranch.js"></script>
</body>
</html>
